name: 发布学习入口

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'lessons/**'
      - 'assignments/**'
      - 'data/**'
      - 'scripts/prepare.mjs'
      - 'scripts/build-pages-entry.mjs'
      - 'tests/pages-entry.test.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取项目
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 检查学习入口
        run: node --test tests/pages-entry.test.mjs
      - name: 生成登录入口
        run: node scripts/build-pages-entry.mjs
      - name: 上传入口
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4

