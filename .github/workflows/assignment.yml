name: 检查作业

on:
  push:
    paths:
      - 'submissions/**/*.py'
      - 'submissions/**/*.ipynb'
  pull_request:
    paths:
      - 'submissions/**/*.py'
      - 'submissions/**/*.ipynb'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 获取项目
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装计算工具
        run: python -m pip install -r requirements.txt
      - name: 检查本次提交的作业
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if os.environ['EVENT_NAME'] == 'pull_request':
              base = event['pull_request']['base']['sha']
              head = event['pull_request']['head']['sha']
              comparison = [base + '...' + head]
          else:
              base = event['before']
              head = event['after']
              if base == '0' * 40:
                  base = subprocess.check_output(
                      ['git', 'hash-object', '-w', '-t', 'tree', '--stdin'],
                      input='', text=True,
                  ).strip()
              comparison = [base, head]
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMRT', '-z', *comparison],
              text=True,
          ).split('\0')
          paths = [
              name for name in changed
              if name.startswith('submissions/')
              and Path(name).suffix in {'.py', '.ipynb'}
              and Path(name).is_file()
          ]
          failed = False
          for name in paths:
              print(f'检查 {name}', flush=True)
              outcome = subprocess.run([sys.executable, 'scripts/check_assignment.py', name])
              failed = failed or outcome.returncode != 0
          if not paths:
              print('本次提交没有需要检查的作业文件。')
          sys.exit(1 if failed else 0)
          PY
